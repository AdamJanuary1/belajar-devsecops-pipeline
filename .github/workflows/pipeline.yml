
name: DevsecOps Pipeline P12


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-and-quality:
    runs-on: self-hosted


    steps:
      -name: Checkout Repository
       uses: actions/checkout@v4


      -name: Setup Python
       uses: actions/setup-python@v5
       with:
        python-version: '3.12'


      -name: Install Dependencies
       run:
        python -m pip install --upgrade pip
        pip install pylint flask semgrep


      -name: Run Semgrep
       run:
        semgrep --version
        semgrep scan --config auto .
